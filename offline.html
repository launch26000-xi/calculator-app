<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No2 is offline</title>
<meta name="theme-color" content="#0B2545">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-art="eagle" style="padding:0">
<main id="main" style="max-width:520px;text-align:center;padding-top:40px">
  <div class="card">
    <p style="font-family:var(--stencil);font-size:3rem;color:var(--red);margin:0;transform:rotate(-4deg)">No2</p>
    <h1>You’re offline right now</h1>
    <p>No signal? No problem. Pages you already opened still work.</p>
    <p>When you’re back online, tap the button to try again.</p>
    <div class="btn-row" style="justify-content:center">
      <button class="btn red" onclick="location.reload()">Try again</button>
      <a class="btn ghost" href="./#/trade">Go to Trading Post</a>
    </div>
  </div>
  <p class="slogan" style="margin-top:20px">The Right Rite</p>
</main>
</body>
</html>
